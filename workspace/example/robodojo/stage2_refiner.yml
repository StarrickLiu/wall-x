# RoboDojo, stage 2 of 2: the residual refiner.
#
# A flow-matching policy is close to a fixed point of its own denoiser: feeding
# its output back in returns roughly the same thing, so it cannot correct
# itself, and more integration steps do not help. What it never sees while
# training is the mapping it actually needs at inference -- "my own output" to
# "the demonstration". The refiner learns exactly that.
#
# It is a second copy of the action branch, trained while the stage-1 model is
# frozen. Each pass takes the policy's sampled chunk and returns a residual;
# `refine_loops` passes are chained, each applying `refine_step_scale` of it.
# Its output head starts at zero, so an untrained refiner changes nothing.
#
# Before training:
#
#   1. Train stage 1, or point `pretrained_path` at a stage-1 checkpoint.
#
#   2. Calibrate which candidates to score. The refiner should not be pulled
#      towards a demonstration the policy sensibly disagreed with, so samples
#      too far from it are dropped -- by a margin that describes the policy
#      being refined, which is why it cannot ship with the code:
#
#        python scripts/calibrate_refiner_margins.py \
#          --train-config workspace/example/robodojo/stage2_refiner.yml \
#          --out margins.json
#
# Launch (from the repository root):
#
#   torchrun --nproc_per_node=8 \
#     wall_x/trainer/fsdp_trainer/train_fsdp.py \
#     --config workspace/example/robodojo/stage2_refiner.yml

model_type: qwen3_5

task:
  dof_config:
    master_left_ee_cartesian_pos_relative: 3
    master_left_ee_rotation_6D_relative: 6
    master_left_gripper: 1
    master_right_ee_cartesian_pos_relative: 3
    master_right_ee_rotation_6D_relative: 6
    master_right_gripper: 1
    action_padding: 6
  agent_pos_config:
    follow_left_ee_cartesian_pos: 3
    follow_left_ee_rotation_6D: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos: 3
    follow_right_ee_rotation_6D: 6
    follow_right_gripper: 1
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: true

model:
  backbone: qwen3_5
  config_path: workspace/models_config/qwen3_5_4B_mot.json
  processor_path: Qwen/Qwen3.5-4B
  # The policy to refine: a stage-1 checkpoint. There is nothing to correct
  # without one.
  pretrained_path: ./checkpoints/robodojo_stage1_memory
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.0        # stage 2 trains the refiner only
  # What this package can install. The faster masked kernel the
  # published run used is not part of it.
  attn_implementation: sdpa
  new_special_tokens:
    - <|kf_write|>
    - <|kf_skip|>
    - <|kf_end|>
    - <|R_0|>
    - <|R_1|>
    - <|R_2|>
    - <|R_3|>
    - <|R_4|>
    - <|R_5|>
    - <|R_6|>
    - <|R_7|>
    - <|R_8|>
    - <|R_9|>
    - <|R_10|>
    - <|R_11|>
    - <|R_12|>
    - <|R_13|>
    - <|R_14|>
    - <|R_15|>

  refiner:
    enabled: true
    # The integration budget the candidates are drawn with. The refiner learns
    # the residual of *that* distribution, so serving with another budget is
    # refused rather than silently degraded.
    num_steps: 10
    # The candidate is presented as if it were the end of integration.
    timestep: 1.0
    # Four passes, each taking a quarter of its residual. One pass at scale 1.0
    # is the plain candidate-plus-residual form.
    #
    # Only the last pass is trained. The earlier ones build the estimate it
    # starts from and run without gradients, which is what they are at
    # inference -- and the weights are shared, so backpropagating the chain
    # would use each decoder layer several times in one graph, which the
    # optimizer's parameter ownership does not allow.
    refine_loops: 4
    refine_step_scale: 0.25
    # Keep the policy fixed. Only the refiner's own copy of the action branch
    # learns; a gradient reaching the policy would mean it is being changed
    # rather than corrected.
    freeze_base: true

data:
  dataset_type: robodojo
  robodojo:
    repo_id: RoboDojo-Benchmark/Robodojo
    root: ../data/RoboDojo_ee_lerobot_v30_video
    annotations: ../data/robodojo_memory_annotations
    # The refiner corrects action chunks; the selector is already trained.
    selection: false
  memory:
    capacity: 22
    window: 48
    candidates: 16
    short_term: 0
    short_term_stride: 4
    box_crop: true
    box_jitter: true
  refiner:
    # Written by scripts/calibrate_refiner_margins.py against this policy.
    margins: ./margins.json
  # Off, as in stage 1: the refiner is trained to correct what the policy
  # samples from the observation it will be served, not from a perturbed one.
  state_noise: null
  resolution:
    face_view: 448
    left_wrist_view: 448
    right_wrist_view: 448
  image_factor: 28
  min_pixels: 3136
  max_pixels: 1003520
  state_bins: 255
  # A selection prompt carries the whole memory and every candidate, so it
  # is long; truncation would cut the answer off the end. Reaching this
  # limit is refused rather than trained through.
  max_length: 28672
  padding_side: right
  num_workers: 8

distributed:
  backend: dmuon
  bf16: true
  recompute:
    enable: true
    decoder:
      default: full

hyperparams:
  seed: 42
  num_epoch: 1
  batch_size_per_gpu: 1
  # Stage 2 trains one objective on one kind of sample, so this is only the
  # effective batch size: four candidates' corrections per update.
  gradient_accumulation_steps: 4
  optimizer:
    optimizer_type: dmuon
    # Both rates are the same here too, and higher than stage 1's: this trains
    # a second action branch from scratch over a base that does not move.
    learning_rate: 3.0e-5
    muon_lr: 3.0e-5
    adamw_lr: 3.0e-5
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 150
    num_training_steps: 20000
    min_lr: 3.0e-6

logging:
  log_name: robodojo_stage2_refiner
  log_interval: 10
  save_interval: 5000
  use_wandb: false

checkpoint:
  save_path: ./checkpoints/robodojo_stage2_refiner
  resume_from: null

debug:
  max_steps: 0
